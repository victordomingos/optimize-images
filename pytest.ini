[pytest]
# Run with "python -m pytest" from the repository root, in any venv that has
# the dependencies (requirements-dev.txt); no editable install is needed.
testpaths = tests
pythonpath = . tests
addopts = -ra
markers =
    slow: long-running regression matrices (deselect with -m "not slow")
# Deprecations are errors, so code that would break in the next Pillow (or
# Python) release fails now. Add a targeted "ignore:<message>" line only for
# third-party warnings we cannot fix, with a comment.
filterwarnings =
    error::DeprecationWarning
